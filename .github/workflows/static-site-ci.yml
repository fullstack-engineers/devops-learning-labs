name: Static Site Docker CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build static site Docker image
        run: docker build -t static-site-ci ./month-02-git-github-cicd/day-06-dockerized-static-site
